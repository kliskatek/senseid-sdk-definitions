                unit_long: Pascals
                unit_short: Pa
                type: float
                transform: none
                coefficients: []
              - magnitude: Temperature
                magnitude_short: T
                unit_long: Celsius
                unit_short: C
                type: float
                transform: none
                coefficients: []
          fw_versions: [1]
    0x11:
          name: Zygos-RM
