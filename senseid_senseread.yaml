version: 6
date: 2026-06-04

pen_header: [0x00, 0x00, 0x00, 0xF1, 0xD3]

# senseRead tags share the SenseID PEN header AND type numbering with standard
# SenseID (e.g. 0x05 = RHAT for both). They are told apart by the family marker
# at byte 6: a senseRead tag carries 0xFF there, a standard SenseID tag carries
# a real fw_version.
epc_family_marker: 0xFF

# EPC layout for Kliskatek senseRead tags (96 bits = 12 bytes):
#   bytes 0-4 : PEN header (above)
#   byte  5   : type        (same numbering as senseid_rain.yaml; 0x05 = RHAT)
#   byte  6   : epc_family_marker (0xFF marks the tag as senseRead; standard
#               SenseID carries a real fw_version here. The real firmware version
#               of a senseRead tag lives in the User-memory datagram instead.)
#   bytes 7-11: SN          (big-endian, 5 bytes -> 1.1 trillion serial numbers)
#
# A senseRead tag is identified by PEN + byte-6 == epc_family_marker. The `type`
# byte then selects the product below. Unknown types are reported as
# "Unknown senseRead type".

# Sensor payload lives in tag User memory (Rocky100 SPI buffer).
# Reader must inventory + embedded Read on USER bank.
memory_bank: user
word_offset: 0x100
# Keep at 3 words = 6 bytes to match LEGACY_DATAGRAM_SIZE in the firmware
# (drivers/r100_legacy.h). The R700 NAKs reads that overrun the tag's
# exposed buffer and then starves other tags in a retry loop, so this
# must stay aligned with the firmware-side buffer size. ACC/MGF (8-byte
# datagrams) need a firmware update first; until then they parse with
# the trailing axes/QoS missing.
word_count: 3

# Datagram layout (6 bytes / 3 words):
#   byte 0   : fw_version  (uint8)
#   bytes 1-N: sensor data, parsed per type.data_def (little-endian)
#   last byte: QoS byte appended by R100 (ignored by sensor parsing)
#
# fw_version values in skip_when mean "SPI buffer not refreshed yet"
# (R100 only arms SPI once per systick ~204ms). Parser leaves data=None
# in those cases so the tag is still reported (read count keeps ticking).
skip_when:
    fw_version: [0x00, 0xFF]

types:
    0x01:
          name: EVAL-SREAD-AT
          description: Ambient Temperature Sensor (Kliskatek senseRead, datagram in User memory)
          datasheet_url: https://www.kliskatek.com/wp-content/uploads/2025/02/DS-EVAL-SID-AT-1V3.pdf
          store_url: https://www.kliskatek.com/producto/eval-sid-at-dkw/
          data_def:
              - magnitude: Temperature
                magnitude_short: T
                unit_long: Celsius
                unit_short: C
                type: int16
                transform: linear
                coefficients: [0, 0.01]
                valid_range: [-40, 125]
          fw_versions: [1]
    0x02:
          name: EVAL-SREAD-ACC
          description: 3-Axis Accelerometer (Kliskatek senseRead, datagram in User memory)
          datasheet_url: https://www.kliskatek.com/wp-content/uploads/2025/02/DS-EVAL-SID-ACC-1V3.pdf
          store_url: https://www.kliskatek.com/producto/eval-sid-acc-dkw/
          data_def:
              - magnitude: X
                magnitude_short: X
                unit_long: gravity
                unit_short: g
                type: int16
                transform: linear
                coefficients: [0, 0.001]
              - magnitude: Y
                magnitude_short: Y
                unit_long: gravity
                unit_short: g
                type: int16
                transform: linear
                coefficients: [0, 0.001]
              - magnitude: Z
                magnitude_short: Z
                unit_long: gravity
                unit_short: g
                type: int16
                transform: linear
                coefficients: [0, 0.001]
          fw_versions: [1]
    0x03:
          name: EVAL-SREAD-MGF
          description: 3-Axis Magnetic Field Sensor (Kliskatek senseRead, datagram in User memory)
          datasheet_url: https://www.kliskatek.com/wp-content/uploads/2025/02/DS-EVAL-SID-MGF-1V3.pdf
          store_url: https://www.kliskatek.com/producto/eval-sid-mgf-dkw/
          data_def:
              - magnitude: X
                magnitude_short: X
                unit_long: gauss
                unit_short: gauss
                type: int16
                transform: linear
                coefficients: [0, 0.001]
              - magnitude: Y
                magnitude_short: Y
                unit_long: gauss
                unit_short: gauss
                type: int16
                transform: linear
                coefficients: [0, 0.001]
              - magnitude: Z
                magnitude_short: Z
                unit_long: gauss
                unit_short: gauss
                type: int16
                transform: linear
                coefficients: [0, 0.001]
          fw_versions: [1]
    0x05:
          name: EVAL-SREAD-RHAT
          description: Ambient Humidity Sensor (Kliskatek senseRead, datagram in User memory)
          datasheet_url: https://www.kliskatek.com/wp-content/uploads/2025/02/DS-EVAL-SID-RHAT-1V3.pdf
          store_url: https://www.kliskatek.com/producto/eval-sid-rhat-dkw/
          data_def:
              - magnitude: Humidity
                magnitude_short: RH
                unit_long: RH%
                unit_short: '%'
                type: uint16
                transform: linear
                coefficients: [0, 0.01]
                valid_range: [0, 100]
              - magnitude: Temperature
                magnitude_short: T
                unit_long: Celsius
                unit_short: C
                type: int16
                transform: linear
                coefficients: [0, 0.01]
                valid_range: [-40, 125]
          fw_versions: [1]
    0x06:
          name: EVAL-SREAD-CTN
          description: Contact Temperature Sensor (Kliskatek senseRead, datagram in User memory)
          datasheet_url: https://www.kliskatek.com/wp-content/uploads/2025/02/DS-EVAL-SID-CTN-1V3.pdf
          store_url: https://www.kliskatek.com/producto/eval-sid-ctn-dkw/
          data_def:
              - magnitude: Temperature
                magnitude_short: T
                unit_long: Celsius
                unit_short: C
                type: int16
                transform: thermistor-beta
                coefficients: [3950, 10000, 25]
          fw_versions: [1]
